<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adventskalender 2026 für Franzi</title>
  <style>
    :root {
      --bg-dark: #131b26;
      --bg-card: #1d293a;
      --bg-card-hover: #26364d;
      --gold: #e6c17a;
      --gold-soft: rgba(230, 193, 122, 0.25);
      --accent-red: #9e2a2b;
      --text-main: #f8f5f0;
      --text-muted: #c7d0dc;
      --unlocked-bg: #243447;
      --opened-bg: #2f2428;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1f2f44 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      overflow-x: hidden;
      position: relative;
    }

    .snowflakes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      top: -10px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 1rem;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 1.5rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--gold-soft);
      backdrop-filter: blur(6px);
    }

    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--gold);
      margin-bottom: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .preview-banner {
      display: none;
      margin: 1rem auto 0;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(230, 193, 122, 0.16);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .preview-banner.active {
      display: inline-block;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .calendar-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 1.2rem;
      }
    }

    .door {
      aspect-ratio: 1 / 1.05;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--bg-card), #16202d);
      border: 1px solid var(--gold-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      padding: 0.8rem;
      text-align: center;
      user-select: none;
    }

    .door:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      border-color: var(--gold);
    }

    .door.locked {
      opacity: 0.72;
      background: linear-gradient(145deg, #17202c, #111822);
    }

    .door.unlocked:not(.opened) {
      background: linear-gradient(145deg, #273b54, #1b2a3d);
      border-color: var(--gold);
      box-shadow: 0 0 18px rgba(230, 193, 122, 0.18);
    }

    .door.opened {
      background: linear-gradient(145deg, var(--opened-bg), #1e1922);
      border-color: rgba(230, 193, 122, 0.55);
    }

    .door-number {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 0.45rem;
    }

    .door-badge {
      font-size: 0.76rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .door.opened .door-badge {
      background: rgba(230, 193, 122, 0.18);
      color: var(--gold);
    }

    .door-icon {
      font-size: 1.15rem;
      margin-top: 0.45rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 16, 0.82);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

   .modal-image {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      margin-bottom: 1rem;
      border: 1px solid var(--gold-soft);
      display: block;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      background: #1a2535;
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 1.6rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      animation: popIn 0.22s ease;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--gold-soft);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .modal-day {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .modal-title {
      font-size: 1.55rem;
      margin-bottom: 1rem;
      padding-right: 2rem;
    }

    .modal-text {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text-main);
      white-space: pre-line;
    }

    .locked-note {
      padding: 1rem;
      border-radius: 12px;
      background: rgba(158, 42, 43, 0.18);
      border: 1px solid rgba(230, 193, 122, 0.35);
      color: var(--text-muted);
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="snowflakes" id="snowflakes"></div>

  <div class="container">
    <header>
      <h1>Adventskalender 2026 für Franzi</h1>
      <p>
        24 Türchen voller gemeinsamer Erinnerungen, schöner und lustiger Momente und kleiner Liebesgrüße für die Adventszeit.
      </p>
      <div class="preview-banner" id="preview-banner">
        Vorschau-Modus aktiv (?preview=true) – alle 24 Türchen sind freigeschaltet
      </div>
    </header>

    <main class="calendar-grid" id="calendar-grid"></main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Schließen">&times;</button>
      <div class="modal-day" id="modal-day"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isPreviewMode = urlParams.get("preview") === "true";

    if (isPreviewMode) {
      document.getElementById("preview-banner").classList.add("active");
    }

    const calendarData = [
      { day: 1, title: "Winterblick am Meer", imageUrl: "./bilder/1.jpg", text: "Mit rosa Mütze, dicker Jacke und entspanntem Blick aufs Wasser – ein wunderschöner Start in die kalte Jahreszeit mit dir." },
      { day: 2, title: "Strahlend schön am Morgen", imageUrl: "./bilder/2.jpg", text: "Dieses Lächeln macht jeden Tag ein Stück heller. Schön, dass es dich gibt." },
      { day: 3, title: "Eingekuschelt im Schnee", imageUrl: "./bilder/3.jpg", text: "Draußen kalt und weiß, drinnen warm ums Herz. Gemeinsam im Schnee unterwegs zu sein, gehört zu meinen liebsten Momenten." },
      { day: 4, title: "Kerzenschein & Kuchen", imageUrl: "./bilder/4.jpg", text: "Kleine Feiern, Kerzen, Kuchen und gute Laune – solche Abende mit dir möchte ich nie missen." },
      { day: 5, title: "Kuss und Partyhütchen", imageUrl: "./bilder/5.jpg", text: "Ein Luftkuss mit Sternchen in den Augen – charmant, verspielt und unverwechselbar Franzi." },
      { day: 6, title: "Am Wasser mit Hafenblick", imageUrl: "./bilder/6.jpg", text: "Frische Luft, weites Wasser und Kräne in der Ferne – genau unsere Welt." },
      { day: 7, title: "Gut gelaunt zu Hause", imageUrl: "./bilder/7.jpg", text: "Ganz entspannt und mit diesem herrlichen Lachen – manchmal sind die schlichtesten Momente die besten." },
      { day: 8, title: "Sonne im Gesicht", imageUrl: "./bilder/8.jpg", text: "Sommerliche Wärme, Locken im Licht und ein Lächeln, das sofort gute Laune macht." },
      { day: 9, title: "Unterwegs mit Peace-Zeichen", imageUrl: "./bilder/9.jpg", text: "Ein gemeinsamer Moment draußen mit viel Stimmung und guter Energie." },
      { day: 10, title: "Voller Einsatz beim Tough Mudder", imageUrl: "./bilder/10.jpg", text: "Nass, laut und voller Teamgeist: Wenn wir zusammen anpacken, lachen wir selbst im größten Abenteuer." },
      { day: 11, title: "Mit Rucksack auf dem Waldweg", imageUrl: "./bilder/11.jpg", text: "Schritt für Schritt durch den Wald – mit schwerem Rucksack, aber leichtem Herzen an deiner Seite." },
      { day: 12, title: "Sonnige Auszeit am Wasser", imageUrl: "./bilder/12.jpg", text: "Blauer Himmel, Wind im Haar und ein strahlendes Gesicht – ein Moment zum Festhalten." },
      { day: 13, title: "Draußen im Freien", imageUrl: "./bilder/13.jpg", text: "Frische Luft und gemeinsame Runden – zusammen macht jeder Ausflug mehr Spaß." },
      { day: 14, title: "Gemütlicher Flur-Moment", imageUrl: "./bilder/14.jpg", text: "Ein herrlich echter Schnappschuss mitten aus dem Alltag – herzlich und ungestellt." },
      { day: 15, title: "Kuss auf die Stirn in der Sonne", imageUrl: "./bilder/15.jpg", text: "Warmes Sonnenlicht und ein lieber Kuss – in solchen Sekunden fühlt sich alles genau richtig an." },
      { day: 16, title: "Am Flughafen auf Reisen", imageUrl: "./bilder/16.jpg", text: "Vorfreude auf neue Wege, Abenteuer und gemeinsame Ziele – mit dir gehe ich gern los." },
      { day: 17, title: "Am Geländer in der Sonne", imageUrl: "./bilder/17.jpg", text: "Wasser, Sonne und ein breites Lachen – ein wunderbarer Tag zusammen." },
      { day: 18, title: "Gemütliche Runde am Tisch", imageUrl: "./bilder/18.jpg", text: "Schöne Gespräche, vertraute Gesichter und ein herzliches Lächeln mittendrin." },
      { day: 19, title: "Tierisch gute Laune", imageUrl: "./bilder/19.jpg", text: "Wenn man den Kopf durch die Fotowand steckt, wird aus jedem Spaziergang eine kleine Comedy-Show." },
      { day: 20, title: "Vor großer Kulisse", imageUrl: "./bilder/20.jpg", text: "Strahlend blauer Himmel und beeindruckende Architektur – und das Beste steht direkt im Vordergrund." },
      { day: 21, title: "Volle Grimasse", imageUrl: "./bilder/21.jpg", text: "Auch mal albern und völlig ungeschönt – genau dieser Humor macht dich so liebenswert." },
      { day: 22, title: "Mit Stock auf dem Pfad", imageUrl: "./bilder/22.jpg", text: "Gut ausgerüstet und mit einem Lachen auf den Lippen – bereit für den nächsten Kilometer." },
      { day: 23, title: "Angekommen in Sterzing / Vipiteno", imageUrl: "./bilder/23.jpg", text: "Ein Meilenstein auf unserer Tour – stolz, müde und glücklich gemeinsam am Ziel angekommen." },
      { day: 24, title: "Am Wasser zum Fest", imageUrl: "./bilder/24.jpg", text: "Frohe Weihnachten, meine Liebe! Danke für jedes gemeinsame Lachen, jeden geteilten Weg und alles, was noch vor uns liegt." }
    ];

    const STORAGE_KEY = "adventskalender_franzi_2026_opened";

    function getOpenedDays() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function markDayOpened(day) {
      const opened = getOpenedDays();
      if (!opened.includes(day)) {
        opened.push(day);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(opened));
      }
    }

    function getDoorStatus(day) {
      if (isPreviewMode) return "unlocked";

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth(); // 11 = Dezember
      const date = now.getDate();

      if (year < 2026 || (year === 2026 && month < 11)) {
        return "locked";
      }
      if (year > 2026 || (year === 2026 && month === 11 && day <= date)) {
        return "unlocked";
      }
      return "locked";
    }

    const gridEl = document.getElementById("calendar-grid");
    const modalBackdrop = document.getElementById("modal-backdrop");
    const modalDayEl = document.getElementById("modal-day");
    const modalTitleEl = document.getElementById("modal-title");
    const modalBodyEl = document.getElementById("modal-body");
    const modalCloseBtn = document.getElementById("modal-close");

    function openModal(item, status) {
      modalDayEl.textContent = `${item.day}. Dezember 2026`;

      if (status === "locked") {
        modalTitleEl.textContent = "Noch verschlossen";
        modalBodyEl.innerHTML = `
          <div class="locked-note">
            Dieses Türchen lässt sich erst am <strong>${item.day}. Dezember 2026</strong> öffnen.
            Ein kleines bisschen Geduld noch – dann wartet eine neue Überraschung auf dich!
          </div>
        `;
      } else {
        modalTitleEl.textContent = item.title;
        markDayOpened(item.day);
        modalBodyEl.innerHTML = `
          <img class="modal-image" src="${item.imageUrl}" alt="${item.title}" />
          <p class="modal-text">${item.text}</p>
        `;
        renderCalendar();
      }

      modalBackdrop.classList.add("open");
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
    }

    modalCloseBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    function renderCalendar() {
      const openedDays = getOpenedDays();
      gridEl.innerHTML = "";

      calendarData.forEach((item) => {
        const status = getDoorStatus(item.day);
        const isOpened = openedDays.includes(item.day);

        const door = document.createElement("button");
        door.type = "button";
        door.className = `door ${status} ${isOpened ? "opened" : ""}`;

        let badgeText = "Wartet auf Dezember";
        let icon = "🔒";

        if (status === "unlocked" && isOpened) {
          badgeText = "Geöffnet";
          icon = "✨";
        } else if (status === "unlocked") {
          badgeText = "Jetzt öffnen";
          icon = "🎁";
        }

        door.innerHTML = `
          <div class="door-number">${item.day}</div>
          <div class="door-badge">${badgeText}</div>
          <div class="door-icon">${icon}</div>
        `;

        door.addEventListener("click", () => openModal(item, status));
        gridEl.appendChild(door);
      });
    }

    function createSnowflakes() {
      const snowContainer = document.getElementById("snowflakes");
      const count = 28;
      for (let i = 0; i < count; i++) {
        const flake = document.createElement("div");
        flake.className = "snowflake";
        flake.textContent = "❄";
        flake.style.left = `${Math.random() * 100}%`;
        flake.style.fontSize = `${0.75 + Math.random() * 0.9}rem`;
        flake.style.opacity = `${0.25 + Math.random() * 0.5}`;
        const duration = 8 + Math.random() * 10;
        flake.style.animationDuration = `${duration}s`;
        flake.style.animationDelay = `-${Math.random() * duration}s`;
        snowContainer.appendChild(flake);
      }
    }

    createSnowflakes();
    renderCalendar();
  </script>
</body>
</html>
